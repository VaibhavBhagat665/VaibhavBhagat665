<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Vaibhav Bhagat</title>
<desc id="d">A terminal window that types out: python train.py --run vaibhav. Vaibhav Bhagat, AI/ML student building models and the full-stack apps around them, with a loss curve that falls as training continues.</desc>
<style>
  .m { font-family: 'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','Courier New',monospace; font-variant-ligatures: none; }
  @keyframes type  { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
  @keyframes fade  { from { opacity: 0; } to { opacity: 1; } }
  @keyframes draw  { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes grow  { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

  .cmd   { animation: type 1.3s steps(31, end) .4s backwards; }
  .name  { animation: type .8s steps(14, end) 1.9s backwards; }
  .tag1  { animation: fade .5s ease-out 2.6s backwards; }
  .tag2  { animation: fade .5s ease-out 2.8s backwards; }
  .log1  { animation: type .6s steps(34, end) 3.2s backwards; }
  .log2  { animation: type .6s steps(34, end) 3.7s backwards; }
  .log3  { animation: type .6s steps(34, end) 4.2s backwards; }
  .fill  { transform-box: fill-box; transform-origin: left center; animation: grow 1.5s cubic-bezier(.2,.7,.2,1) 4.7s backwards; }
  .axes  { animation: fade .6s ease-out 1.2s backwards; }
  .c1    { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.4s cubic-bezier(.3,.6,.3,1) 2.2s backwards; }
  .c2    { stroke-dasharray: 1; stroke-dashoffset: 0; animation: draw 2.4s cubic-bezier(.3,.6,.3,1) 2.5s backwards; }
  .end   { animation: fade .4s ease-out 4.7s backwards; }
  .prompt{ animation: fade .3s ease-out 5.0s backwards; }
  .cur   { animation: blink 1.1s steps(1, end) 5.2s infinite; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<defs>
  <clipPath id="win"><rect width="900" height="360" rx="14"/></clipPath>
</defs>

<!-- window -->
<g clip-path="url(#win)">
  <rect width="900" height="360" fill="#0D1B24"/>
  <rect width="900" height="40" fill="#112431"/>
  <rect y="40" width="900" height="1" fill="#1F3A4A"/>
</g>
<rect x=".5" y=".5" width="899" height="359" rx="14" fill="none" stroke="#1F3A4A"/>
<circle cx="26" cy="20" r="5.5" fill="#2B4A5C"/><circle cx="46" cy="20" r="5.5" fill="#2B4A5C"/><circle cx="66" cy="20" r="5.5" fill="#2B4A5C"/>
<text class="m" x="450.0" y="25" text-anchor="middle" font-size="12.5" fill="#6C8595">vaibhav@iiit-sonepat: ~/train</text>

<!-- left column -->
<text class="m cmd" x="40" y="94" font-size="15" fill="#DCE7EE"><tspan fill="#FFB347">$</tspan> python train.py --run vaibhav</text>

<text class="m name" x="38" y="156" font-size="42" font-weight="700" fill="#DCE7EE">Vaibhav Bhagat</text>

<text class="m tag1" x="40" y="190" font-size="16" fill="#5ED3C0">AI/ML student building models,</text>
<text class="m tag2" x="40" y="213" font-size="16" fill="#5ED3C0">and the full-stack apps around them.</text>

<g class="m log1" font-size="13.5">
  <text x="40"  y="256" fill="#5ED3C0">ok</text>
  <text x="74"  y="256" fill="#6C8595">school</text>
  <text x="160" y="256" fill="#DCE7EE">B.Tech IT, IIIT Sonepat</text>
</g>
<g class="m log2" font-size="13.5">
  <text x="40"  y="280" fill="#5ED3C0">ok</text>
  <text x="74"  y="280" fill="#6C8595">focus</text>
  <text x="160" y="280" fill="#DCE7EE">transformers, RAG, agents</text>
</g>
<g class="m log3" font-size="13.5">
  <text x="40"  y="304" fill="#FFB347">..</text>
  <text x="74"  y="304" fill="#6C8595">training</text>
  <rect x="160" y="296" width="140" height="8" rx="4" fill="#17303F"/>
  <text x="312" y="304" fill="#DCE7EE">class of 2028</text>
</g>
<rect class="fill" x="160" y="296" width="78" height="8" rx="4" fill="#FFB347"/>

<g class="m prompt">
  <text x="40" y="338" font-size="13.5" fill="#FFB347">$</text>
  <rect class="cur" x="54" y="326" width="8" height="15" fill="#DCE7EE"/>
</g>

<!-- right column: loss curve -->
<g class="axes">
  <line x1="590" y1="108" x2="852" y2="108" stroke="#17303F"/>
  <line x1="590" y1="195" x2="852" y2="195" stroke="#17303F"/>
  <line x1="590" y1="282" x2="852" y2="282" stroke="#1F3A4A"/>
  <line x1="590" y1="100" x2="590" y2="282" stroke="#1F3A4A"/>
  <text class="m" x="590" y="90" font-size="11.5" fill="#6C8595">loss</text>
  <text class="m" x="852" y="302" font-size="11.5" fill="#6C8595" text-anchor="end">epochs</text>
  <line x1="728" y1="86" x2="744" y2="86" stroke="#FFB347" stroke-width="2.5" stroke-linecap="round"/>
  <text class="m" x="750" y="90" font-size="11.5" fill="#6C8595">train</text>
  <line x1="796" y1="86" x2="812" y2="86" stroke="#5ED3C0" stroke-width="2.5" stroke-linecap="round"/>
  <text class="m" x="818" y="90" font-size="11.5" fill="#6C8595">val</text>
</g>
<path class="c2" pathLength="1" d="M590.0,105.7 L594.8,114.5 L599.5,121.7 L604.3,125.6 L609.1,139.6 L613.8,143.8 L618.6,147.9 L623.3,157.0 L628.1,164.1 L632.9,172.5 L637.6,175.3 L642.4,179.8 L647.2,182.2 L651.9,186.8 L656.7,189.8 L661.5,195.1 L666.2,198.8 L671.0,201.6 L675.7,205.0 L680.5,210.6 L685.3,210.2 L690.0,212.0 L694.8,216.7 L699.6,219.3 L704.3,220.9 L709.1,221.6 L713.9,223.9 L718.6,224.9 L723.4,224.9 L728.1,227.9 L732.9,227.9 L737.7,229.9 L742.4,229.9 L747.2,231.0 L752.0,233.1 L756.7,234.2 L761.5,232.5 L766.3,232.9 L771.0,233.9 L775.8,234.7 L780.5,236.7 L785.3,235.1 L790.1,235.9 L794.8,239.1 L799.6,237.2 L804.4,237.9 L809.1,240.3 L813.9,240.0 L818.7,239.8 L823.4,239.2 L828.2,239.8 L832.9,241.3 L837.7,242.6 L842.5,241.9 L847.2,243.2 L852.0,242.3" fill="none" stroke="#5ED3C0" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/>
<path class="c1" pathLength="1" d="M590.0,126.1 L594.8,106.1 L599.5,149.3 L604.3,135.4 L609.1,166.1 L613.8,151.4 L618.6,150.3 L623.3,176.2 L628.1,155.1 L632.9,195.9 L637.6,192.9 L642.4,202.2 L647.2,201.5 L651.9,199.1 L656.7,227.0 L661.5,227.3 L666.2,230.8 L671.0,228.5 L675.7,202.8 L680.5,222.8 L685.3,232.8 L690.0,233.8 L694.8,234.7 L699.6,234.0 L704.3,228.6 L709.1,237.0 L713.9,237.2 L718.6,238.5 L723.4,238.7 L728.1,245.3 L732.9,243.6 L737.7,240.8 L742.4,246.6 L747.2,248.6 L752.0,249.8 L756.7,255.3 L761.5,249.7 L766.3,248.9 L771.0,250.3 L775.8,252.9 L780.5,247.9 L785.3,256.8 L790.1,254.1 L794.8,252.4 L799.6,247.9 L804.4,255.3 L809.1,255.8 L813.9,256.7 L818.7,253.4 L823.4,256.7 L828.2,259.2 L832.9,254.2 L837.7,262.2 L842.5,257.0 L847.2,253.7 L852.0,257.9" fill="none" stroke="#FFB347" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<g class="m end">
  <circle cx="852.0" cy="257.9" r="4.5" fill="#FFB347"/>
  <text x="838.0" y="227.9" font-size="12" fill="#DCE7EE" text-anchor="end">still training</text>
</g>
</svg>
